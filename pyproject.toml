[project]
name = "qubit-sequencer"
version = "0.4.1"
description = "Local superconducting quantum chip registry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/third-party/*.txt"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["reportlab>=4"]
build = ["pyinstaller>=6", "Pillow>=10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qubit_sequencer*"]

[tool.setuptools.package-data]
qubit_sequencer = ["assets/*.png", "assets/*.ico", "assets/*.svg"]
